[project]
name = "nlx-bedrock-job-structured-extraction"
version = "0.1.0"
description = ""
authors = [
    {name = "Ross Katz",email = "ross.katz@corrdyn.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ruff (>=0.9.2,<0.10.0)",
    "boto3 (>=1.36.3,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pyarrow (>=19.0.0,<20.0.0)",
    "duckdb (>=1.1.3,<2.0.0)",
    "awscli (>=1.37.4,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "pydantic (>=2.10.5,<3.0.0)",
    "isort (>=5.13.2,<6.0.0)"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
